global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9091"]
  - job_name: fleet
    file_sd_configs:
      - files: [/etc/prometheus/targets.json]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [component]
        target_label: job
