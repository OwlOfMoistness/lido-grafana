    {
      "name": "All reporting clients contribute to loaded count",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"validator\",instance=\"v1\",host=\"validator-1\"}",
          "values": "1+0x10"
        },
        {
          "series": "validators{job=\"validator\",instance=\"v1\",host=\"validator-1\"}",
          "values": "100+0x10"
        },
        {
          "series": "up{job=\"validator\",instance=\"v2\",host=\"validator-2\"}",
          "values": "1+0x10"
        },
        {
          "series": "validators{job=\"validator\",instance=\"v2\",host=\"validator-2\"}",
          "values": "200+0x10"
        },
        {
          "series": "up{job=\"validator\",instance=\"v3\",host=\"validator-3\"}",
          "values": "1+0x10"
        },
        {
          "series": "validators{job=\"validator\",instance=\"v3\",host=\"validator-3\"}",
          "values": "300+0x10"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "sum((validators{job=\"validator\",host=~\"validator-1|validator-2|validator-3\"} and on(job, instance) (up{job=\"validator\",host=~\"validator-1|validator-2|validator-3\"} == 1))) and on() (count((validators{job=\"validator\",host=~\"validator-1|validator-2|validator-3\"} and on(job, instance) (up{job=\"validator\",host=~\"validator-1|validator-2|validator-3\"} == 1))) == count(up{job=\"validator\",host=~\"validator-1|validator-2|validator-3\"}))",
          "eval_time": "10m",
          "exp_samples": [
            {
              "labels": "{}",
              "value": 600
            }
          ]
        }
      ]
    },
