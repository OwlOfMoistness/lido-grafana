name: lido-fleet

# Standalone deployment: only this file and .env are needed (plus hub SSH files).
# .env maps HUB to COMPOSE_PROFILES; no --profile flag or source checkout needed.
x-role: ${COMPOSE_PROFILES:?Keep COMPOSE_PROFILES in .env as shown in .env.example}

x-control: &control
  image: ${CONTROL_IMAGE:-ghcr.io/owlofmoistness/lido-grafana:0.5.0}
  pull_policy: ${CONTROL_PULL_POLICY:-always}
  profiles: ["true"]
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-settings: &settings
  LOCAL_VALIDATOR_ENABLED: ${LOCAL_VALIDATOR_ENABLED:-true}
  VC_ID: ${VC_ID:-validator-1}
  VC_NAME: ${VC_NAME:-VC 1}
  VC_METRICS_ADDRESS: ${VC_METRICS_ADDRESS:-127.0.0.1:8808}
  NODE_EXPORTER_PORT: ${NODE_EXPORTER_PORT:-19103}
  PROMETHEUS_PORT: ${PROMETHEUS_PORT:-9092}
  GRAFANA_PORT: ${GRAFANA_PORT:-3200}
  BACKEND_ADDRESS: ${BACKEND_ADDRESS:-}
  MAIN_BEACON_PORT: ${MAIN_BEACON_PORT:-18008}
  MAIN_EXECUTION_PORT: ${MAIN_EXECUTION_PORT:-19105}
  MAIN_HOST_PORT: ${MAIN_HOST_PORT:-49103}
  FALLBACK_BEACON_PORT: ${FALLBACK_BEACON_PORT:-28008}
  FALLBACK_EXECUTION_PORT: ${FALLBACK_EXECUTION_PORT:-29105}
  FALLBACK_HOST_PORT: ${FALLBACK_HOST_PORT:-59103}
  MAIN_EXECUTION_PATH: ${MAIN_EXECUTION_PATH:-/metrics}
  FALLBACK_EXECUTION_PATH: ${FALLBACK_EXECUTION_PATH:-/debug/metrics/prometheus}
  SCRAPE_INTERVAL: ${SCRAPE_INTERVAL:-30s}
  CHILDREN: ${CHILDREN:-[]}
  INVENTORY_ENABLED: ${INVENTORY_ENABLED:-false}
  INVENTORY_PORT: ${INVENTORY_PORT:-19200}
  MAIN_BEACON_API_PORT: ${MAIN_BEACON_API_PORT:-5052}
  FALLBACK_BEACON_API_PORT: ${FALLBACK_BEACON_API_PORT:-5552}

services:
  host-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    network_mode: host
    pid: host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - --web.listen-address=127.0.0.1:${NODE_EXPORTER_PORT:-19103}
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
    volumes:
      - /:/host:ro,rslave

  configure:
    <<: *control
    network_mode: none
    # Validate hub-only secrets here so a child needs no hub configuration.
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        case "$${GRAFANA_ADMIN_PASSWORD:-}" in
          ''|REPLACE*|replace-this-before-starting)
            echo 'Set a strong GRAFANA_ADMIN_PASSWORD in .env before starting the hub.' >&2
            exit 1 ;;
        esac
        exec python /app/control.py generate
    environment:
      <<: *settings
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
    volumes:
      - fleet-config:/generated

  tunnels:
    <<: *control
    restart: unless-stopped
    network_mode: host
    command: [tunnels]
    environment: *settings
    depends_on:
      configure:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${SSH_KEY_FILE:-./private/ssh/id_ed25519}
        target: /run/ssh/id
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SSH_KNOWN_HOSTS_FILE:-./private/ssh/known_hosts}
        target: /run/ssh/known_hosts
        read_only: true
        bind:
          create_host_path: false

  inventory:
    <<: *control
    restart: unless-stopped
    network_mode: host
    command: [inventory]
    environment: *settings
    volumes:
      - type: bind
        source: ${INVENTORY_DIR:-./inventory}
        target: /inventory
        read_only: true

  prometheus:
    profiles: ["true"]
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    network_mode: host
    depends_on:
      configure:
        condition: service_completed_successfully
    command:
      - --config.file=/generated/prometheus.json
      - --web.listen-address=127.0.0.1:${PROMETHEUS_PORT:-9092}
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
    volumes:
      - fleet-config:/generated:ro
      - prometheus-data:/prometheus

  grafana:
    profiles: ["true"]
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    network_mode: host
    depends_on:
      configure:
        condition: service_completed_successfully
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:-3200}
      GF_PATHS_PROVISIONING: /generated/provisioning
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
    volumes:
      - fleet-config:/generated:ro
      - grafana-data:/var/lib/grafana

volumes:
  fleet-config:
  prometheus-data:
  grafana-data:
